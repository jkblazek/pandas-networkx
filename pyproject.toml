[tool.poetry]
name = "auction"
version = "0.1.0"
description = "Experimental graph-based market auction simulator"
authors = ["JordanBlocher <jordanblocher@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,!=3.14.1,<3.15"
networkx = "^3.7"
matplotlib = "^3.9"
termcolor = "^3.0"
seaborn = "^0.13.2"
numpy = "^2.0"
pandas = ">=3.0,<4"
plotly = ">=6,<8"
dash = ">=3,<5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"

[tool.pytest.ini_options]
addopts = "-p no:dash"
testpaths = ["auction", "models", "nxn", "params", "sim"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
